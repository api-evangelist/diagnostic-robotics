aid: diagnostic-robotics
name: Diagnostic Robotics
description: >-
  Diagnostic Robotics is a Tel Aviv and Boston based clinical AI company whose platform turns medical claims,
  EHR and FHIR data into predictive risk stratification, actionable next steps and automated care operations
  for health plans, providers and care organizations. The company publishes two public developer projects on a
  Stoplight-hosted documentation portal: a Patient Questionnaire / triage API that walks a patient through
  symptom search, adaptive questioning and a triage outcome, and a Proactive Patient Risk Feed (Precision
  Population Health) API that ingests FHIR R4 US Core, CCLF and custom claims datasets and returns ranked risk
  lists, per-patient risk profiles, HCC/RAF risk-adjustment gaps and embeddable widgets. Access is OAuth 2.0
  client-credentials or API key and is provisioned per customer on a dedicated per-client subdomain.
