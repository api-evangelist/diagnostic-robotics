- name: Diagnostic Robotics Patient Questionnaire API
  description: >-
    REST API for the patient-questionnaire and triage service. Create a patient, open a visit, attach symptoms,
    walk the adaptive question tree one question at a time, finish the visit, then read the medical summary and
    triage outcomes. Authenticated with an x-client API key issued by Diagnostic Robotics.
