summary: >-
  Two disjoint object graphs. The Precision Population Health graph is anchored on Patient: a RiskList ranks
  patients, each patient has a RiskProfile (drivers + next steps), a PatientProfile (demographics + information
  sections) and a RiskAdjustmentProfile (coded and uncoded HCC conditions). The Patient Questionnaire graph is
  anchored on Visit: a Patient has Visits, a Visit accumulates Symptoms and Questions and terminates in
  Outcomes. Nothing links the two - there is no shared patient identifier type across the products.
identifiers:
  patient_id:
    type: string
    format: opaque customer-supplied member id
    examples_in_docs: [MX22334, MX12345]
    note: The member id is the customer's own id space; Diagnostic Robotics does not mint it.
  risk_list_id:
    type: string
    format: 32-char lowercase hex (uuid without dashes)
    example: 72be622eb2b445f086b346265c050d56
  visit_id:
    type: string
    source: openapi/diagnostic-robotics-patient-questionnaire-openapi.yml
