test_values:
  published: false
  note: >-
    No test patient ids, test risk list ids, test claims files or magic identifiers are published. The sample
    identifiers that appear in the integration guides (patientId MX22334 / MX12345, risk list id
    72be622eb2b445f086b346265c050d56) are documentation illustrations, not working fixtures, and are recorded
    here only so an agent does not mistake them for credentials.
sample_data_pointers:
